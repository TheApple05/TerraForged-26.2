plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

group = project.maven_group
version = project.mod_version
base.archivesName = project.archives_base_name

loom {
    accessWidenerPath = file('common/src/main/resources/terraforged-26.2.accesswidener')
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.minecraftforge.net/' }
}

// Compile every upstream common/Fabric Java source, including UI and integrations.
sourceSets {
    main {
        java.setSrcDirs(['common/src/main/java', 'fabric/src/main/java'])
        resources.setSrcDirs([
            'common/src/main/resources', 'fabric/src/main/resources',
            'fabric/src/main/generated'
        ])
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Real artifacts only. An annotation dependency does NOT weave ExpectPlatform.
    compileOnly 'dev.architectury:architectury-injectables:1.0.10'
    compileOnly("com.github.glitchfiend:TerraBlender-fabric:${project.terrablender_version}") {
        transitive = false
    }
    compileOnly 'com.electronwill.night-config:toml:3.6.7'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    // Only reviewed 26.2 access rules are applied. Mixin AP remains a separate
    // validation stage after source migration; see decision 0001.
    options.compilerArgs.addAll(['-proc:none', '-Xmaxerrs', '10000', '-Xdiags:verbose'])
}

tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.register('writePortClasspath') {
    group = 'verification'
    description = 'Writes resolved diagnostic classpath for isolated QA adapters.'
    doLast {
        def output = layout.buildDirectory.file('qa/target/compile-classpath.txt').get().asFile
        output.parentFile.mkdirs()
        output.text = configurations.compileClasspath.asPath
        println 'Resolved classpath written to build/qa/target/compile-classpath.txt'
    }
}

tasks.register('portToolchain') {
    group = 'verification'
    description = 'Prints actual toolchain and resolved diagnostic classpath.'
    dependsOn 'writePortClasspath'
    doLast {
        def compiler = javaToolchains.compilerFor(java.toolchain).get()
        def report = [
            minecraft: project.minecraft_version,
            gradle: gradle.gradleVersion,
            loom: '1.17.21',
            javaRuntime: System.getProperty('java.version'),
            javaCompiler: compiler.metadata.languageVersion.asInt(),
            sourceFiles: sourceSets.main.allJava.files.size(),
            sourceRoots: sourceSets.main.java.srcDirs.collect { relativePath(it) }.sort(),
            excludedJavaSources: [],
            accessWidenerApplied: true,
            annotationProcessing: false,
            expectPlatformWeaving: false,
            classpath: configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts.collect {
                "${it.moduleVersion.id.group}:${it.name}:${it.moduleVersion.id.version}"
            }.sort()
        ]
        println 'PORT_TOOLCHAIN_JSON=' + groovy.json.JsonOutput.toJson(report)
    }
}

// Candidate packages are for isolated runtime validation. The explicit guard
// prevents an unfinished candidate being mistaken for a validated release.
tasks.named('jar') {
    from('LICENSE')
    from('THIRD_PARTY_NOTICES.md')
    from('licenses') { into('META-INF/licenses') }
    doFirst {
        if (!project.hasProperty('experimentalPackage')) {
            throw new GradleException('Use -PexperimentalPackage only for isolated validation of this unfinished port; see docs/decisions/0001-build-layout.md.')
        }
    }
}
