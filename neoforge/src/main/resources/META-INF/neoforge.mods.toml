[[mods]]
modId="reterraforged"
version="${version}"
displayName="TerraForged Revival"
authors="dags, Won-Ton, racoonman2, TerraForged 26.2 contributors"
displayURL="https://github.com/TheApple05/TerraForged-26.2"
description='''An independent, unofficial TerraForged revival for Minecraft Java 26.2. Development build.'''

[[mixins]]
config="reterraforged-common.mixins.json"
[[mixins]]
config="reterraforged-neoforge.mixins.json"

[[accessTransformers]]
