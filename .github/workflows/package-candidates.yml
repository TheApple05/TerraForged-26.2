name: Package both 26.2 loaders (experimental)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.loader }} / Java 25
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Package the complete loader source set
        shell: bash
        run: |
          if [ "${{ matrix.loader }}" = "neoforge" ]; then
            bash ./gradlew --project-dir=neoforge jar portToolchain -PexperimentalPackage --console=plain
          else
            bash ./gradlew jar portToolchain -PexperimentalPackage --console=plain
          fi
      - name: Retain experimental candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraforged-26.2-${{ matrix.loader }}-${{ github.sha }}
          path: ${{ matrix.loader == 'neoforge' && 'neoforge/build/libs/*.jar' || 'build/libs/*.jar' }}
          if-no-files-found: error
          retention-days: 14
